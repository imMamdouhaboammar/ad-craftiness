<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="craft-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />

  <!-- Outer Conceptual Spotlight / Ad Aperture -->
  <g transform="translate(256, 256)">
    <!-- Ambient Glow Circle -->
    <circle r="140" fill="#6366F1" opacity="0.12" filter="url(#glow)" />
    <circle r="90" fill="#F59E0B" opacity="0.15" filter="url(#glow)" />

    <!-- Craft Arc 1: The Blueprint / Frame -->
    <path d="M -130 -40 C -130 -115, -70 -160, 0 -160 C 90 -160, 160 -90, 160 0 C 160 90, 90 160, 0 160 C -60 160, -110 130, -135 85"
          fill="none" stroke="url(#craft-grad)" stroke-width="24" stroke-linecap="round" />

    <!-- Craft Arc 2: The Arabic "ص" / Creative Swoosh -->
    <path d="M -100 20 C -70 -40, 20 -70, 75 -20 C 120 20, 90 80, 20 85 C -50 90, -80 50, -40 0 C 0 -45, 60 -50, 100 -20"
          fill="none" stroke="#F1F5F9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- The Creative Spark (Idea Generation / Insight Star) -->
    <g transform="translate(60, -60)" filter="url(#glow)">
      <!-- 4-point Star of Inspiration -->
      <path d="M 0 -45 Q 0 0 -45 0 Q 0 0 0 45 Q 0 0 45 0 Q 0 0 0 -45 Z" fill="url(#spark-grad)" />
      <!-- Star Core -->
      <circle r="8" fill="#FFFBEB" />
    </g>

    <!-- Dynamic Craft Accents -->
    <circle cx="-50" cy="115" r="7" fill="#38BDF8" />
    <circle cx="120" cy="85" r="9" fill="#F59E0B" />
    <circle cx="-110" cy="-75" r="6" fill="#A855F7" />
  </g>
</svg>
