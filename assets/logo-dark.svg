<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="dark-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="dark-craft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="dark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#dark-bg)" />
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="#1E293B" stroke-width="2" />

  <g transform="translate(256, 210)">
    <circle r="110" fill="#6366F1" opacity="0.12" filter="url(#dark-glow)" />
    <circle r="70" fill="#F59E0B" opacity="0.15" filter="url(#dark-glow)" />

    <path d="M -100 -30 C -100 -90, -50 -125, 0 -125 C 70 -125, 125 -70, 125 0 C 125 70, 70 125, 0 125 C -50 125, -85 100, -105 65"
          fill="none" stroke="url(#dark-craft)" stroke-width="18" stroke-linecap="round" />

    <path d="M -75 15 C -55 -30, 15 -55, 60 -15 C 95 15, 70 60, 15 65 C -40 70, -60 40, -30 0 C 0 -35, 45 -40, 75 -15"
          fill="none" stroke="#F8FAFC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <g transform="translate(48, -48)" filter="url(#dark-glow)">
      <path d="M 0 -35 Q 0 0 -35 0 Q 0 0 0 35 Q 0 0 35 0 Q 0 0 0 -35 Z" fill="url(#dark-spark)" />
      <circle r="6" fill="#FFFBEB" />
    </g>

    <circle cx="-40" cy="90" r="5" fill="#38BDF8" />
    <circle cx="95" cy="65" r="7" fill="#F59E0B" />
  </g>

  <text x="256" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="1">صنعة الإعلان</text>
  <text x="256" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#94A3B8" letter-spacing="3">AD CRAFTINESS</text>
  <text x="256" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#38BDF8" letter-spacing="1">BY MAMDOUH ABOAMMAR • FAROUK ELKADY</text>
</svg>
